name: "Check Branch"

on:
  pull_request:

jobs:
  check_branch_main:
    runs-on: ubuntu-latest
    steps:
      - name: Check branch
        if: github.base_ref == 'main' && github.head_ref != 'staging'
        run: |
          echo "ERROR: You can only merge to main from staging."
          exit 1
  check_branch_staging:
    runs-on: ubuntu-latest
    steps:
      - name: Check branch
        if: github.base_ref == 'staging' && github.head_ref != 'main'
        run: |
          echo "ERROR: You can only merge to staging from main."
          exit 1
