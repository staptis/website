name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
      - staging
      - development
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read
  deployments: write

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_PROJECT_NAME: ${{ secrets.CLOUDFLARE_PAGES_PROJECT_WEBSITE }}

jobs:
  deploy:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup environment
        run: |
          REF="${{ github.ref_name }}"
          PR_NUMBER="${{ github.event.pull_request.number }}"

          if [[ "$REF" == "main" ]]; then
            echo "DEPLOY_ENV=production" >> $GITHUB_ENV
            echo "BRANCH=main" >> $GITHUB_ENV
            echo "DEPLOY_URL=https://staptis.com" >> $GITHUB_ENV

          elif [[ "$REF" == "staging" ]]; then
            echo "DEPLOY_ENV=staging" >> $GITHUB_ENV
            echo "BRANCH=staging" >> $GITHUB_ENV
            echo "DEPLOY_URL=https://staging.staptis.com" >> $GITHUB_ENV

          elif [[ "$REF" == "development" ]]; then
            echo "DEPLOY_ENV=development" >> $GITHUB_ENV
            echo "BRANCH=development" >> $GITHUB_ENV
            echo "DEPLOY_URL=https://dev.staptis.com" >> $GITHUB_ENV

          elif [[ -n "$PR_NUMBER" ]]; then
            echo "DEPLOY_ENV=preview" >> $GITHUB_ENV
            echo "BRANCH=preview-${PR_NUMBER}" >> $GITHUB_ENV
            echo "DEPLOY_URL=https://preview-${PR_NUMBER}.staptis.com" >> $GITHUB_ENV
          fi
      - name: start github deployment
        uses: bobheadxi/deployments@v1
        id: deployment
        with:
          step: start
          token: ${{ secrets.GITHUB_TOKEN }}
          env: ${{ env.DEPLOY_ENV }}
          env_url: ${{ env.DEPLOY_URL }}
          deployment_id: ${{ github.event.deployment.id }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_PROJECT_NAME: your-project-name
          COMMIT_HASH: ${{ github.sha }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          npx wrangler pages deploy ./dist \
            --project-name="$CLOUDFLARE_PROJECT_NAME" \
            --branch="$BRANCH" \
            --commit-hash="$COMMIT_HASH" \
            --commit-message="$COMMIT_MESSAGE"
      - name: Create GitHub Deployment
        if: ${{ always() }}
        uses: bobheadxi/deployments@v1
        with:
          step: finish
          token: ${{ secrets.GITHUB_TOKEN }}
          env: ${{ env.DEPLOY_ENV }}
          env_url: ${{ env.DEPLOY_URL }}
          status: ${{ job.status }}
          deployment_id: ${{ steps.deployment.outputs.deployment_id }}

  delete-preview:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Delete preview deployment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PROJECT_NAME: ${{ secrets.CLOUDFLARE_PROJECT_NAME }}
          BRANCH: preview-${{ github.event.pull_request.number }}
        run: |
          curl -X DELETE "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$CLOUDFLARE_PROJECT_NAME/deployments?branch=$BRANCH" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json"
